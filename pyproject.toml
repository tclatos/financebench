[project]
name = "financebench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baml-py>=0.223.0",
    "genai-tk",
    "genai_graph",
    "datasets>=2.20",
    "pandas>=2.2",
    "httpx>=0.27",
]

[tool.uv.sources]
genai-tk = { git = "https://github.com/tclatos/genai-tk", branch = "main" }
# Local path — Markdown Knowledge Tree support is under active development in
# the sibling genai-graph checkout; switch to a git ref once merged/pushed.
genai_graph = { path = "../genai-graph", editable = true }
[tool.uv]
package = true


# Forward genai-tk optional extras — install with: uv sync --extra <name>
[project.optional-dependencies]
harnessing = ["genai-tk[harnessing]"]
browser    = ["genai-tk[browser]"]
nlp        = ["genai-tk[nlp]"]
postgres   = ["genai-tk[postgres]"]
streamlit  = ["genai-tk[streamlit]"]
baml       = ["genai-tk[baml]", "baml-py"]  # baml-py must be direct to expose baml-cli binary
chromadb   = ["genai-tk[chromadb]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financebench"]
