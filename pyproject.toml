[project]
name = "financebench"
version = "0.1.0"
description = "Benchmarking a Document Graph + agentic search stack on[FinanceBench]"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baml-py>=0.223.0",
    "genai-tk[harnessing]",
    "genai_graph",
    "datasets>=2.20",
    "pandas>=2.2",
    "httpx>=0.27",
    "firecrawl-anydoc>=0.2.4",
]

[tool.uv.sources]
genai-tk = { git = "https://github.com/tclatos/genai-tk", rev = "main" }
# Local path — Markdown Knowledge Tree support is under active development in
# the sibling genai-graph checkout; switch to a git ref once merged/pushed.
genai_graph = { path = "../genai-graph", editable = true }
[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financebench"]

[tool.ruff]
builtins = ["ic", "debug"]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "I", # isort rules
    "W", # Pycodestyle warnings
    "B", # Bugbear
    "C", # Better comprehensions
    "PIE",
    "PD", # Pandas
    "FURB",
]
ignore = [
    "E501",   # Line too long (we use 120 chars)
    "W291",   # Trailing whitespace
    "B006",   # Mutable default args
    "C901",   # Complex function
    "COM812", # Trailing comma conflicts
    "ISC001", # Implicit string concat conflicts
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

