# FinanceBench evaluation configurations and document conversion settings.
# Select active profile via CLI `--profile <name>` (defaults to `default_profile`).
# Outcome paths write under a dedicated directory per bench profile.

default_profile: mistral_glm

# Shared paths across all bench profiles using OmegaConf variable interpolation.
# Can be overridden per profile if needed.
paths:
  pdfs_dir: ${paths.data_root}/pdfs
  markdown_dir: ${paths.data_root}/markdown_multi
  kg_db: ${paths.data_root}/kg/financebench_multi.db
  onedrive_markdown_dir: ~/OneDrive/prj/financebench/markdown
  runs: ${paths.data_root}/financebench/{profile}/runs.jsonl
  scores: ${paths.data_root}/financebench/{profile}/scores.jsonl
  scores_summary: ${paths.data_root}/financebench/{profile}/scores_summary.json

bench_profiles:
  mistral_glm:
    description: "GLM 5.2 agent with Mistral OCR (medium profile) and DeepSeek V4 Pro judge"
    markdownize_profile: medium

    llms:
      agent: glm_5.2@openrouter
      build: deepseek-v4-flash-0731@openrouter
      judge: DeepSeek-V4-Pro-0813@openrouter

    build:
      skip_ocr: false
      force: true
      llm: false             # false = fast algorithmic TOC & heading parsing; true = LLM-enhanced
      workers: 4
      summary_min_tokens: 800
      context_safety_ratio: 0.9
      embeddings: qwen3_06b@deepinfra  # SectionChunk vector model (null = no vector leg, keyword-only search)
      fts: true                       # native BM25/FTS index over MarkdownSection(title, text, description)
      chunk_size_tokens: 1500         # target chunk size for long sections

    files:
      pathspecs:
        - "BESTBUY_2024Q2_10Q*"
        - "Pfizer_2023Q2_10Q*"
        - "JOHNSON_JOHNSON_2023_8K_dated-2023-08-30*"
      limit: null

    agent:
      profile: default
      folder_id: null         # null = whole corpus (agent must pick the right doc)

    judge:
      enabled: true


# Document converter definitions and pathspec-driven profiles
markdownize_profiles:
  fast:
    rules:
      - pathspec: "**/*.{xlsx,xls,ods}"
        converter: messy_xls
      - pathspec: "**/*"
        converter: markitdown

  medium:
    rules:
      - pathspec: "**/*.{xlsx,xls,ods}"
        converter: messy_xls
      - pathspec: "**/*.{ppt,pptx,odp,doc,docx,odt,rtf}"
        converter: via_pdf
      - pathspec: "**/*.pdf"
        converter: mistral_ocr
      - pathspec: "**/*"
        converter: markitdown

  best:
    rules:
      - pathspec: "**/*.{ppt,pptx,odp,doc,docx,odt,rtf,xlsx,xls,ods}"
        converter: via_pdf
      - pathspec: "**/*.pdf"
        converter: mistral_ocr
      - pathspec: "**/*"
        converter: markitdown


