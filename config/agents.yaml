# Unified Agent Profiles — all harnesses under one ``agents:`` dict.
#
# Each profile carries a ``harness:`` discriminator (``langchain`` | ``deerflow``).
# The optional ``agent_defaults:`` block holds inheritable defaults applied to
# ``harness: langchain`` profiles (DeerFlow profiles are fully self-describing).
# See docs/agents.md and docs/harness.md.

agent_defaults:
  type: react
  llm: null  # null = use the global default LLM from config
  middlewares:
    - class: genai_tk.agents.langchain.middleware.rich_middleware.RichToolCallMiddleware
  checkpointer:
    type: none
  backend:
    type: none
  enable_planning: true
  enable_file_system: true
  skills:
    directories:
      - ${paths.project}/skills/custom
      - ${paths.project}/skills/community
  default_profile: default

agents:
  default:
    harness: langchain
    name: "Default Agent"
    type: react
    llm: default
    system_prompt: >
      You are a helpful AI assistant for financebench.
      Use available tools when they help answer the question.
    tools:
      - factory: financebench.tools.example_tool.create_example_tools
    mcp_servers: []

  research:
    harness: langchain
    name: "Research Agent"
    type: deep
    llm: default
    enable_planning: true
    system_prompt: >
      You are a research assistant. Plan your approach, use available tools,
      and produce well-structured, cited responses.
    skill_directories:
      - ${paths.project}/skills/custom
      - ${paths.project}/skills/community

  # Deep agent that answers FinanceBench questions by navigating the Document
  # Graph. `cli agent answer` (financebench/commands/agent_commands.py) loads
  # this profile and runs it through `genai_graph.agent.create_docgraph_agent`,
  # which injects the Document Graph navigation tools and the colocated
  # genai_graph/agent/skills plus this project's skills/custom.
  docgraph:
    harness: langchain
    name: "FinanceBench QA Analyst"
    type: deep
    llm: deepseek_v4flash@openrouter
    description: "Deep agent that answers FinanceBench financial questions by navigating the Document Graph."
    system_prompt: |
      You are an expert financial analyst answering FinanceBench questions about a
      company's SEC filing (10-K / 10-Q) by navigating the Document Graph in your
      tools. You do NOT have the document memorised — you must read it via the
      graph tools: `get_folder_toc`, `get_document_toc`, `get_section_content`,
      `search_sections`. File tools (read_file, grep, glob, ...) are disabled —
      rely on the graph alone.

      Where financial-statement answers live (target these by name):
      - Cash flow statement ("capital expenditure", "cash from operations",
        "investing/financing activities", "depreciation") ->
        search_sections("Consolidated Statements of Cash Flows").
      - Balance sheet ("net PP&E", "inventory", "current assets/liabilities",
        "goodwill", "total debt", "quick ratio", "working capital") ->
        search_sections("Consolidated Balance Sheets").
      - Income statement ("revenue", "net income", "gross margin", "operating
        income/margin", "EPS", "SG&A") -> search_sections("Consolidated
        Statements of Operations").
      - Stockholders' equity ("dividends", "share repurchases", "equity") ->
        search_sections("Stockholders").
      - Segment / MD&A ("which segment grew", "what drove revenue/margin change",
        "customer concentration") -> search_sections("Segment") or
        search_sections("Management"), then read MD&A sections.
      - Products / business description ("what products does X sell") ->
        get_document_toc, then read "Item 1. Business".

      Answering rules:
      - Read the table before you compute. Ratios (quick ratio, turnover, capex %
        of revenue, multi-year averages) need two or more numbers, often from
        different statements. Read each source section fully, extract the exact
        line-item names and values, THEN compute.
      - Units & rounding: answer in the units the question asks for (USD millions,
        billions, percent) with the requested rounding. If the question says
        "primarily using the balance sheet", anchor on the balance sheet.
      - Signs & periods: cash-flow line items are often shown as negatives in
        parentheses, e.g. (1,577). Report capex as a positive amount unless the
        question asks for the signed cash-flow value. Match the exact fiscal
        period the question names (FY22 vs FY21 vs a quarter).
      - Cite every fact with its section id `[hash::sequence]` and the source
        document filename, e.g. (AMD_2022_10K_pdf.md [f391da52bf0af1c2::13]).
      - Never invent. If a number or fact is not in the sections you read, say so
        explicitly. Do not infer from general knowledge about the company.
      - Answer directly: the answer first, then the key supporting numbers and a
        citation. Do not paste whole sections.
    tools: []
    skill_directories:
      - ${paths.project}/skills/custom
    enable_planning: true
    enable_file_system: false
    # Graph-only retrieval: hide deepagents' built-in sandbox/file/subagent
    # tools so the agent navigates via get_folder_toc/get_document_toc/
    # get_section_content/search_sections instead of reading/grepping the
    # markdown, and cannot delegate to the general-purpose subagent (which
    # retains file tools in its own stack). `read_file` is excluded too, so
    # full SKILL.md content is unreadable at runtime — the navigation strategy
    # lives in the system prompt instead.
    excluded_tools:
      - ls
      - read_file
      - grep
      - glob
      - write_file
      - edit_file
      - execute
      - task
    recursion_limit: 160
