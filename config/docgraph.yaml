# Document Graph building profile for FinanceBench (SEC filings corpus)
default_profile: default

docgraph_profiles:
  default:
    description: "Ladybug Document Graph for FinanceBench SEC filings"
    markdownize_profile: best

    paths:
      sources_dir: ${paths.data_root}/pdfs
      markdown_dir: ${paths.data_root}/markdown_multi
      kg_db: ${paths.data_root}/kg/financebench_multi.db
      saved_markdown_dir: ~/OneDrive/prj/financebench/markdown

    llms:
      summary: deepseek-v4-flash-0731@openrouter  # LLM for structure and summaries
      image: null                                # No image VLM needed for FinanceBench financial text/tables

    images:
      enabled: false                             # Visual VLM processing disabled
      describe_uncaptioned: false
      min_size_bytes: 10240
      max_queries_per_turn: 3

    build:
      structure_strategy: auto                   # auto | algo | toc_preamble | llm_full
      generate_summaries: true                   # generate section descriptions & summaries for TOC navigation
      summary_min_tokens: 800
      context_safety_ratio: 0.9
      fts: true                                  # native BM25/FTS index over MarkdownSection
      chunk_size_tokens: 1500
      workers: 4
      skip_ocr: false
      force: false
